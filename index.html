<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debreceni Árfigyelő - Premium Smart Comparison</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-glass: rgba(22, 30, 49, 0.65);
            --card-border: rgba(255, 255, 255, 0.08);
            --card-border-hover: rgba(99, 102, 241, 0.4);
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --winner-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --winner-glow: rgba(16, 185, 129, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
        }

        * {
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient háttér világítás (WOW effekt) */
        body::before, body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            pointer-events: none;
            opacity: 0.5;
        }
        body::before {
            background: #6366f1;
            top: -100px;
            left: -100px;
        }
        body::after {
            background: #ec4899;
            bottom: -100px;
            right: -100px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        /* Hero Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .header h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            display: inline-block;
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
        }

        .badge-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #34d399;
            border-radius: 50%;
            box-shadow: 0 0 10px #34d399;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        /* Layout Grid */
        .grid-container {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        /* Glassmorphism Cards */
        .card {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: var(--card-border-hover);
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
        }

        /* Table Design */
        .table-wrapper {
            max-height: 520px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .table-wrapper::-webkit-scrollbar {
            width: 6px;
        }
        .table-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
        }

        th {
            text-align: left;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0 10px 10px 10px;
        }

        tr.product-row {
            background: rgba(255, 255, 255, 0.02);
            transition: all 0.2s ease;
            border-radius: 12px;
        }

        tr.product-row:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(3px);
        }

        td {
            padding: 12px 10px;
        }

        td:first-child { border-radius: 12px 0 0 12px; }
        td:last-child { border-radius: 0 12px 12px 0; }

        .product-link {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .product-link:hover {
            color: var(--accent-cyan);
        }

        .external-icon {
            font-size: 0.75rem;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .product-link:hover .external-icon {
            opacity: 1;
        }

        /* Modern Counter Input */
        .qty-control {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 2px;
        }

        .qty-btn {
            background: transparent;
            border: none;
            color: var(--text-main);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            transition: background 0.2s;
        }

        .qty-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .qty-input {
            width: 36px;
            background: transparent;
            border: none;
            color: #fff;
            text-align: center;
            font-weight: 700;
            font-size: 0.9rem;
            -moz-appearance: textfield;
        }

        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Results & Store Cards */
        .store-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .store-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .store-card:hover {
            background: rgba(255, 255, 255, 0.04);
            transform: translateY(-2px);
        }

        /* Legolcsóbb Kiemelt Kártya (WOW) */
        .store-card.winner {
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid var(--winner-gradient);
            box-shadow: 0 0 25px var(--winner-glow);
        }

        .store-card.winner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--winner-gradient);
        }

        .store-name {
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .winner-badge {
            background: var(--winner-gradient);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .store-link {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            transition: color 0.2s;
        }

        .store-link:hover {
            color: var(--accent-cyan);
        }

        .store-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.01em;
        }

        .winner .store-price {
            color: #34d399;
            font-size: 1.4rem;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="badge-live">
                <span class="pulse-dot"></span>
                <span id="last-update">Adatok frissítése...</span>
            </div>
            <h1>Debreceni Árfigyelő</h1>
            <p>Hasonlítsd össze az árakat valós időben és találd meg a legolcsóbb boltot!</p>
        </div>

        <div class="grid-container">
            <!-- 1. Termék Választó -->
            <div class="card">
                <h2>🛒 1. Kosár összeállítása</h2>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Termék (Kattints a GVH adathoz)</th>
                                <th style="text-align: center;">Mennyiség</th>
                            </tr>
                        </thead>
                        <tbody id="product-list"></tbody>
                    </table>
                </div>
            </div>

            <!-- 2. Összesített Eredmények -->
            <div class="card">
                <h2>📊 2. Boltok árai összesen</h2>
                <div class="store-list" id="results-container">
                    <div class="empty-state">Válassz ki legalább egy terméket a kalkulációhoz!</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let db = null;
        let cart = {};

        const storeWebsites = {
            "Auchan (Debrecen, Kishatár u.)": "https://www.auchan.hu/",
            "Lidl (Debrecen, Derék u.)": "https://www.lidl.hu/",
            "ALDI (Debrecen, Ötvenhatosok tere)": "https://www.aldi.hu/",
            "Penny (Debrecen, István út)": "https://www.penny.hu/",
            "Tesco (Debrecen, Kishegyesi út)": "https://tesco.hu/",
            "Spar (Debrecen, Plaza)": "https://www.spar.hu/"
        };

        async function loadPrices() {
            try {
                const response = await fetch('./prices.json');
                db = await response.json();
                document.getElementById('last-update').innerText = db.last_updated;
                renderProducts();
                calculateTotals();
            } catch (e) {
                document.getElementById('last-update').innerText = "Hiba az adatok betöltésekor.";
            }
        }

        function renderProducts() {
            const tbody = document.getElementById('product-list');
            tbody.innerHTML = '';
            
            db.products.forEach(p => {
                cart[p.id] = 0;
                const row = document.createElement('tr');
                row.className = 'product-row';
                row.innerHTML = `
                    <td>
                        <a href="${p.gvh_url || 'https://arfigyelo.gvh.hu/'}" target="_blank" rel="noopener" class="product-link">
                            ${p.name} <span class="external-icon">↗</span>
                        </a>
                    </td>
                    <td style="text-align: center;">
                        <div class="qty-control">
                            <button class="qty-btn" onclick="changeQty('${p.id}', -1)">-</button>
                            <input type="number" id="qty-${p.id}" class="qty-input" min="0" value="0" onchange="updateCart('${p.id}', this.value)">
                            <button class="qty-btn" onclick="changeQty('${p.id}', 1)">+</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function changeQty(id, delta) {
            const input = document.getElementById(`qty-${id}`);
            let current = parseInt(input.value) || 0;
            let updated = Math.max(0, current + delta);
            input.value = updated;
            updateCart(id, updated);
        }

        function updateCart(id, qty) {
            cart[id] = parseInt(qty) || 0;
            calculateTotals();
        }

        function calculateTotals() {
            if (!db) return;
            const container = document.getElementById('results-container');
            
            const hasItems = Object.values(cart).some(val => val > 0);
            
            if (!hasItems) {
                container.innerHTML = '<div class="empty-state">Válassz ki legalább egy terméket a kalkulációhoz!</div>';
                return;
            }

            container.innerHTML = '';
            let totals = [];

            for (const [storeName, storePrices] of Object.entries(db.stores)) {
                let sum = 0;
                for (const [prodId, qty] of Object.entries(cart)) {
                    if (storePrices[prodId] && qty > 0) {
                        sum += storePrices[prodId] * qty;
                    }
                }
                totals.push({ name: storeName, total: sum });
            }

            totals.sort((a, b) => a.total - b.total);

            totals.forEach((item, index) => {
                const isWinner = index === 0 && item.total > 0;
                const storeUrl = storeWebsites[item.name] || "https://arfigyelo.gvh.hu/";
                const div = document.createElement('div');
                div.className = `store-card ${isWinner ? 'winner' : ''}`;
                div.innerHTML = `
                    <div>
                        <div class="store-name">
                            ${item.name}
                            ${isWinner ? '<span class="winner-badge">Legolcsóbb</span>' : ''}
                        </div>
                        <a href="${storeUrl}" target="_blank" rel="noopener" class="store-link">
                            A bolt saját weboldala ↗
                        </a>
                    </div>
                    <div class="store-price">${item.total.toLocaleString()} Ft</div>
                `;
                container.appendChild(div);
            });
        }

        window.onload = loadPrices;
    </script>
</body>
</html>

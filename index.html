<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debreceni Egyetemi Árösszehasonlító</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .header { text-align: center; margin-bottom: 20px; }
        .last-update { font-size: 0.9em; color: #666; font-style: italic; }
        .grid-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
        .card { background: white; border-radius: 8px; padding: 20px; width: 100%; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        input[type="number"] { width: 60px; padding: 5px; border-radius: 4px; border: 1px solid #ccc; }
        .store-row { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 12px; padding: 8px; border-radius: 4px; background: #f8f9fa; }
        .winner { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🎓 Debreceni Diák Árfigyelő</h1>
        <div class="last-update" id="last-update">Frissítés alatt...</div>
    </div>

    <div class="grid-container">
        <div class="card">
            <h2>1. Állítsd össze a kosarad!</h2>
            <table>
                <thead>
                    <tr><th>Termék / Kategória</th><th>Mennyiség</th></tr>
                </thead>
                <tbody id="product-list"></tbody>
            </table>
        </div>

        <div class="card">
            <h2>2. Teljes fizetendő összeg</h2>
            <div id="results-container"></div>
        </div>
    </div>

    <script>
        let db = null;
        let cart = {};

        async function loadPrices() {
            try {
                const response = await fetch('./prices.json');
                db = await response.json();
                document.getElementById('last-update').innerText = `Utolsó automatikus frissítés: ${db.last_updated}`;
                renderProducts();
                calculateTotals();
            } catch (e) {
                document.getElementById('last-update').innerText = "Hiba az adatok betöltésekor. (Várj az automata frissítésre!)";
            }
        }

        function renderProducts() {
            const tbody = document.getElementById('product-list');
            tbody.innerHTML = '';
            
            db.products.forEach(p => {
                cart[p.id] = 0;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><b>${p.name}</b></td>
                    <td><input type="number" min="0" value="0" onchange="updateCart('${p.id}', this.value)"></td>
                `;
                tbody.appendChild(row);
            });
        }

        function updateCart(id, qty) {
            cart[id] = parseInt(qty) || 0;
            calculateTotals();
        }

        function calculateTotals() {
            if (!db) return;
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            let totals = [];

            for (const [storeName, storePrices] of Object.entries(db.stores)) {
                let sum = 0;
                for (const [prodId, qty] of Object.entries(cart)) {
                    if (storePrices[prodId] && qty > 0) {
                        sum += storePrices[prodId] * qty;
                    }
                }
                totals.push({ name: storeName, total: sum });
            }

            totals.sort((a, b) => a.total - b.total);

            totals.forEach((item, index) => {
                const isWinner = index === 0 && item.total > 0;
                const div = document.createElement('div');
                div.className = `store-row ${isWinner ? 'winner' : ''}`;
                div.innerHTML = `
                    <span>${item.name}</span>
                    <span>${item.total.toLocaleString()} Ft ${isWinner ? '🏆 (LEGOLCSÓBB)' : ''}</span>
                `;
                container.appendChild(div);
            });
        }

        window.onload = loadPrices;
    </script>
</body>
</html>
